<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Плеер с обходом CORS</title>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <style>
        body { background: #121212; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
        video { width: 100%; max-width: 800px; border-radius: 8px; }
    </style>
</head>
<body>

    <video id="video" controls></video>

<script>
    const urlParams = new URLSearchParams(window.location.search);
    const videoSrc = urlParams.get('v');
    const video = document.getElementById('video');

    if (videoSrc) {
        if (Hls.isSupported()) {
            const hls = new Hls({
                // МИМИКРИРУЕМ ПОД СТРАНИЦУ КИНОТЕАТРА
                xhrSetup: function (xhr, url) {
                    // Перенаправляем origin/referer, если браузер позволит это сделать скрипту
                    xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
                }
            });
            hls.loadSource(videoSrc);
            hls.attachMedia(video);
        } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
            video.src = videoSrc;
        }
    } else {
        document.body.innerHTML = '<h3 style="color:white; text-align:center;">Добавьте ?v=ссылка_из_json</h3>';
    }
</script>
</body>
</html>
